orm: translateY(10px); }    38%  { opacity: 1; transform: translateY(0); }    80%  { opacity: 1; transform: translateY(0); }    85%  { opacity: 0; transform: translateY(10px); }    100% { opacity: 0; transform: translateY(10px); }  }  #stage-d { animation: popD 10s ease-in-out infinite; }  @keyframes popD {    0%   { opacity: 0; transform: translateY(10px) scale(1); }    48%  { opacity: 0; transform: translateY(10px) scale(1); }    50%  { opacity: 1; transform: translateY(0) scale(1); }    65%  { opacity: 1; transform: translateY(0) scale(1.06); }    80%  { opacity: 1; transform: translateY(0) scale(1); }    85%  { opacity: 0; transform: translateY(10px) scale(1); }    100% { opacity: 0; transform: translateY(10px) scale(1); }  }</style><linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#BA041A" stop-opacity="0.35"></stop><stop offset="100%" stop-color="#BA041A" stop-opacity="0"></stop></linearGradient></defs><rect width="968" height="792" fill="white"></rect><g id="grid"><line x1="60" y1="190" x2="920" y2="190" stroke="#D3D3D3" stroke-width="2.4" stroke-dasharray="9 6"></line><line x1="60" y1="340" x2="920" y2="340" stroke="#D3D3D3" stroke-width="2.4" stroke-dasharray="9 6"></line><line x1="60" y1="490" x2="920" y2="490" stroke="#D3D3D3" stroke-width="2.4" stroke-dasharray="9 6"></line><line x1="60" y1="640" x2="920" y2="640" stroke="#D3D3D3" stroke-width="2.4" stroke-dasharray="9 6"></line></g><line x1="60" y1="80" x2="60" y2="700" stroke="#17263A" stroke-width="4" stroke-linecap="round"></line><line x1="60" y1="700" x2="920" y2="700" stroke="#17263A" stroke-width="4" stroke-linecap="round"></line><path id="areaFill" d="M90,640 H390 V480 H650 V290 H900 V140 L900,700 L90,700 Z" fill="url(#areaGrad)"></path><path id="stepline" d="M90,640 H390 V480 H650 V290 H900 V140" stroke="#8B0000" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><g id="stage-a" class="stage"><circle cx="90" cy="640" r="9" fil